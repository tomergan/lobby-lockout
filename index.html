<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<meta name="description" content="One elevator. One floor. A tactile escape puzzle inspired by the classic 100 Floors and a real elevator keypad.">
<title>Lobby Lockout · Floor 27</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='6' fill='%233c352b'/%3E%3Cpath d='M8 23 20 8 32 23H25V34H15V23Z' fill='%2369cf28'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="preload" as="image" href="assets/room.webp">
<link rel="preload" as="image" href="assets/doors.webp">
<script src="engine.js" defer></script>
<script src="game.js" defer></script>
</head>
<body>
<main id="stage" aria-label="Lobby Lockout, floor 27">
  <section id="room" class="view" aria-label="Elevator lobby">
    <img class="scene" src="assets/room.webp" alt="A warm stone elevator lobby with bronze trim, a directory on the left and a destination keypad on the right" draggable="false">
    <div id="display" aria-label="Elevator floor display">31</div>
    <div id="opening">
      <button id="doors" aria-label="Inspect elevator doors"><span class="door left"></span><span class="door right"></span></button>
      <button id="enter" class="sprite arrow" aria-label="Enter the elevator" hidden></button>
    </div>
    <span id="elevatorLetter" aria-hidden="true">C</span>
    <button id="directory" aria-label="Inspect the floor directory"><span class="miniDirectory">DIRECTORY<br><b>○ &nbsp;18</b><b>△ &nbsp;24</b><b>□ &nbsp;32</b></span></button>
    <button id="panelHot" aria-label="Inspect the destination keypad"></button>
    <span id="readerLight" aria-hidden="true"></span>
    <button id="coin" class="sprite coin" aria-label="Pick up the brass token" hidden></button>
    <button id="mat" aria-label="Move the floor mat"><span class="sprite matArt" aria-hidden="true"></span></button>
  </section>
  <section id="panel" class="view" aria-label="Destination keypad" hidden>
    <img class="scene" src="assets/panel.webp" alt="The bronze and black keypad, with round silver keys, a wheelchair button, and a card reader with two slotted screws" draggable="false">
    <div id="screen" aria-live="polite"></div>
    <div id="keys"></div>
    <button id="helpKey" aria-label="Inspect keypad help"></button>
    <button id="lockKey" aria-label="Clear the access code"></button>
    <button id="accessibility" aria-label="Accessibility call button"></button>
    <button id="reader" aria-label="Use the card reader"></button>
    <button id="screw0" class="screwHot" aria-label="Left reader cover screw"></button>
    <button id="screw1" class="screwHot" aria-label="Right reader cover screw"></button>
    <span id="panelLight" aria-hidden="true"></span>
    <button id="maintenance" aria-label="Reopen the reader compartment" hidden>⚙</button>
  </section>
  <section id="inspection" class="view" aria-label="Inspect an object" hidden></section>
  <button id="back" class="round back" aria-label="Return to the lobby" hidden>‹</button>
  <div id="toast" role="status" aria-live="polite"></div>
  <footer id="inventory" aria-label="Inventory and game controls">
    <div class="slots">
      <button class="slot" id="slot0" aria-label="Empty inventory slot 1"></button>
      <button class="slot" id="slot1" aria-label="Empty inventory slot 2"></button>
      <button class="slot" id="slot2" aria-label="Empty inventory slot 3"></button>
      <button class="slot" id="slot3" aria-label="Empty inventory slot 4"></button>
    </div>
    <div class="floorLabel">FLOOR <strong>27</strong></div>
    <button id="menu" class="round menu" aria-label="Open game menu"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M2 15 16 3 30 15H26V29H7V15Z" fill="#b2342e" stroke="#e4a39b" stroke-width="1"/><path d="M14 29V20H20V29M10 13h4v4h-4M19 13h4v4h-4" fill="#f0ddd0"/></svg></button>
    <button id="restart" class="round restart" aria-label="Restart floor"><svg viewBox="0 0 32 32" width="31" height="31" aria-hidden="true"><path d="M9 8a11 11 0 1 1-4 12" fill="none" stroke="#278fa6" stroke-width="4"/><path d="m3 4 1 12 11-3Z" fill="#37b7cc" stroke="#ceeaf0" stroke-width="1"/></svg></button>
  </footer>
  <div id="modal" role="dialog" aria-modal="true" aria-label="Game menu" hidden></div>
  <div id="loading">FLOOR 27<span>Loading the lobby…</span></div>
</main>
</body>
</html>
