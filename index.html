<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0d0c">
<title>Lobby Lockout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Layout: one 360x540 portrait stage (art painted at 3x), scaled to fit the window. Single dark surround by choice. */
:root{--ground:#0e0d0c;--ink:#fff;--amber:#ffb04a;--go:#46e06a;--f-ui:"Varela Round","Segoe UI",Arial,sans-serif;--f-hud:"Chakra Petch","Segoe UI",sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:var(--f-ui)}
#wrap{position:absolute;inset:0}
#stage{position:absolute;left:50%;top:50%;width:360px;height:540px;transform-origin:50% 50%;overflow:hidden;background:#000;box-shadow:0 0 60px rgba(0,0,0,.8)}
.abs{position:absolute}
img{display:block;max-width:none;-webkit-user-drag:none;user-drag:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.hot{cursor:pointer}
button:focus-visible,.hot:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
#bg{left:0;top:0;width:360px;height:540px}
#opening{overflow:hidden}
#opening.rattle{animation:rattle .25s}
@keyframes rattle{25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}
.door{top:0;height:100%;transition:transform 1.6s cubic-bezier(.55,0,.35,1)}
.open #dL{transform:translateX(-100%)}
.open #dR{transform:translateX(100%)}
#arrow{opacity:0;transform:scale(.6);transition:opacity .4s,transform .4s;pointer-events:none}
#arrow img{width:100%;height:100%}
#arrow.on{opacity:1;transform:scale(1);pointer-events:auto;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
#ind canvas{width:100%;height:100%}
#miniCheck{opacity:0;transition:opacity .3s;pointer-events:none}
#miniCheck.on{opacity:1}

/* zoom */
#zoom{left:0;top:0;width:360px;height:480px;opacity:0;pointer-events:none;transform:scale(1.05);transition:opacity .28s,transform .28s}
#zoom.on{opacity:1;pointer-events:auto;transform:scale(1)}
#zoomImg{left:0;top:0;width:360px;height:480px}
#back{left:10px;top:10px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#5a5550,#22201e);box-shadow:0 3px 6px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.25);display:grid;place-items:center;z-index:3}
.kbtn{border-radius:50%}
.kbtn.press{background:radial-gradient(circle,rgba(40,60,90,.28) 55%,rgba(40,60,90,0) 72%)}
#hdr{overflow:hidden}
.msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-size:12.5px;line-height:1.15;color:#fff;text-shadow:1px 1px 0 #6a7684,-1px 1px 0 #6a7684,1px -1px 0 #6a7684,-1px -1px 0 #6a7684,1px 3px 3px rgba(0,0,0,.3)}
.s-prompt #msgPrompt,.s-alt #msgAlt,.s-taken #msgPrompt{display:flex}
#kw{position:absolute;inset:0;display:none}
.s-key #kw,.s-denied #kw{display:block}
#skey{position:absolute;left:50%;top:50%;width:112px;height:47px;margin:-23px 0 0 -56px;cursor:grab;touch-action:none;filter:drop-shadow(0 3px 2px rgba(30,40,55,.35))}
#skey img{width:100%;height:100%;pointer-events:none}
#skey.lifted{opacity:0}
.taken #skey{display:none}
#gkey{position:absolute;left:50%;top:50%;width:112px;height:47px;margin:-23px 0 0 -56px;display:none;opacity:.22;filter:grayscale(1) brightness(.4)}
.taken #gkey{display:block}
#xm{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -20px;display:none;pointer-events:none}
.s-denied #xm{display:block;animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.wiggle{animation:wig .45s}
@keyframes wig{20%{transform:rotate(-7deg)}45%{transform:rotate(6deg) translateY(-1px)}70%{transform:rotate(-3deg)}}
.nudge{animation:nud .6s}
@keyframes nud{30%{transform:translate(2px,-3px) rotate(4deg)}60%{transform:translate(-1px,1px) rotate(-2deg)}}
#okv{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:8px;font-size:14px;color:#fff;text-shadow:1px 1px 0 #3e7a4a,-1px 1px 0 #3e7a4a,1px -1px 0 #3e7a4a,-1px -1px 0 #3e7a4a}
#okv img{width:36px;height:36px}
.s-granted #okv{display:flex}
#scrDim{background:rgba(205,230,210,.82);opacity:0;transition:opacity .3s;pointer-events:none}
.granted #scrDim{opacity:1}
#readerGlow{border-radius:8px;pointer-events:none;transition:box-shadow .3s}
#readerGlow.over{box-shadow:inset 0 0 0 2px var(--amber),0 0 16px rgba(255,170,70,.55)}
#readerGlow.pulse{animation:rp .8s 2}
@keyframes rp{50%{box-shadow:inset 0 0 0 2px var(--amber),0 0 14px rgba(255,170,70,.5)}}
#readerGlow.green{box-shadow:inset 0 0 0 2px var(--go),0 0 22px rgba(70,224,106,.7)}
#barGlow{border-radius:3px;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:0 0 14px rgba(90,255,120,.7)}
#barGlow.on{opacity:1}

/* HUD */
.slot{border-radius:4px;touch-action:none;display:grid;place-items:center}
.slot.sel{box-shadow:0 0 0 2px #ffd54a,0 0 10px rgba(255,213,74,.7)}
.slot img{width:44px;height:19px;pointer-events:none}
.slot.pop img{animation:pop .3s}
#fx{left:0;top:0;width:360px;height:540px;pointer-events:none;z-index:20}
.ghost{position:absolute;filter:drop-shadow(0 8px 7px rgba(0,0,0,.45))}
.ghost img{width:100%;height:100%}
#toast{left:50%;top:70px;transform:translateX(-50%);padding:7px 14px;border-radius:16px;background:rgba(15,15,15,.82);font:600 13px/1 var(--f-hud);white-space:nowrap;opacity:0;transition:opacity .25s;z-index:15;pointer-events:none}
#toast.on{opacity:1}
#black{inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:18}
#black.on{opacity:1}
.panel{inset:0;z-index:19;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(10,10,10,.78)}
.panel.on{display:flex;animation:fade .4s}
@keyframes fade{from{opacity:0}}
.card{width:240px;padding:22px 18px;border-radius:14px;background:linear-gradient(#cfd2d6,#8d9298);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 12px 30px rgba(0,0,0,.6);color:#24272b;display:flex;flex-direction:column;gap:12px;align-items:center}
.card h2{margin:0;font:700 15px/1 var(--f-hud);letter-spacing:.3em;padding-left:.3em}
.big{font:700 54px/1 var(--f-hud);color:#1f8a3a;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.card p{margin:0;font:600 14px/1.4 var(--f-hud)}
.pbtn{width:180px;padding:11px 0;border-radius:22px;font:700 14px/1 var(--f-hud);letter-spacing:.08em;background:linear-gradient(#5a5f66,#2b2e32);color:#fff;box-shadow:0 3px 0 #111,inset 0 1px 0 rgba(255,255,255,.25)}
.pbtn.go{background:linear-gradient(#77e08a,#2aa646);color:#062810;box-shadow:0 3px 0 #155e26,inset 0 1px 0 rgba(255,255,255,.4)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

const P=v=>v/3;

$('#dR').style.left=halfW+'px';$('#dR').style.width=halfW+'px';

place($('#ind'),LAY.indDisp);
place($('#plantHot'),LAY.plant);
place($('#mini'),LAY.term);

const mc=$('#miniCheck');{const h=T.header;const s=(h[3]-h[1])*tk*.8;mc.style.width=P(s)+'px';mc.style.height=P(s)+'px';mc.style.left=P(((h[0]+h[2])/2)*tk-s/2)+'px';mc.style.top=P(((h[1]+h[3])/2)*tk-s/2)+'px';}

/* floor indicator: red 7-segment */
const ic=$('#indC'),ix=ic.getContext('2d');
const SEG={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcfgd'};
function seg(x,y,w,h,on){const t=w*.2,g=1.5;const P={a:[[x+t,y],[x+w-t,y],[x+w-t*1.6,y+t],[x+t*1.6,y+t]],d:[[x+t*1.6,y+h-t],[x+w-t*1.6,y+h-t],[x+w-t,y+h],[x+t,y+h]],g:[[x+t*1.3,y+h/2-t/2],[x+w-t*1.3,y+h/2-t/2],[x+w-t*.7,y+h/2],[x+w-t*1.3,y+h/2+t/2],[x+t*1.3,y+h/2+t/2],[x+t*.7,y+h/2]],f:[[x,y+t],[x+t,y+t*1.6],[x+t,y+h/2-t*.8],[x,y+h/2-t*.2]],b:[[x+w,y+t],[x+w,y+h/2-t*.2],[x+w-t,y+h/2-t*.8],[x+w-t,y+t*1.6]],e:[[x,y+h/2+t*.2],[x+t,y+h/2+t*.8],[x+t,y+h-t*1.6],[x,y+h-t]],c:[[x+w,y+h/2+t*.2],[x+w,y+h-t],[x+w-t,y+h-t*1.6],[x+w-t,y+h/2+t*.8]]};
  for(const k in P){ix.beginPath();P[k].forEach((p,i)=>i?ix.lineTo(p[0],p[1]):ix.moveTo(p[0],p[1]));ix.closePath();const lit=on.includes(k);ix.fillStyle=lit?'#ff3b2a':'rgba(255,40,30,.07)';ix.shadowColor=lit?'rgba(255,40,20,.9)':'transparent';ix.shadowBlur=lit?8:0;ix.fill();}}
let blinkOn=true;
function drawInd(n,arrow){ix.clearRect(0,0,180,56);const s=String(n).padStart(2,' ');
  const dw=30,dh=42,y=7;[0,1].forEach(i=>{const ch=s[i];seg(70+i*42,y,dw,dh,ch===' '?'':SEG[ch]);});
  if(arrow&&blinkOn){ix.beginPath();ix.fillStyle='#ff3b2a';ix.shadowColor='rgba(255,40,20,.9)';ix.shadowBlur=8;if(arrow==='down'){ix.moveTo(22,20);ix.lineTo(50,20);ix.lineTo(36,40);}else{ix.moveTo(22,40);ix.lineTo(50,40);ix.lineTo(36,20);}ix.closePath();ix.fill();}}
let indN=31,indA=null;setInterval(()=>{blinkOn=!blinkOn;drawInd(indN,indA);},450);
function setInd(n,a){indN=n;indA=a;blinkOn=true;drawInd(n,a);}
setInd(31,null);

/* audio */
let ac=null,muted=false;
function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function tone(f,d,type,vol,when,to){const a=A();if(!a||muted)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function noise(d,vol,freq){const a=A();if(!a||muted)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=freq;g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start();}
const sfx={beep:()=>tone(1400,.08,'square',.04),deny:()=>{tone(190,.22,'sawtooth',.07);tone(150,.3,'sawtooth',.06,.14)},clink:()=>{tone(2600,.14,'triangle',.06);tone(3500,.1,'triangle',.04,.05)},pick:()=>tone(520,.12,'triangle',.12,0,1250),ok:()=>{tone(880,.12,'sine',.12);tone(1320,.22,'sine',.12,.13)},ding:()=>{tone(1047,1,'sine',.14);tone(784,1.3,'sine',.14,.45)},door:()=>noise(1.5,.09,200),thud:()=>{noise(.15,.12,160);tone(90,.12,'sine',.1)},rustle:()=>noise(.35,.05,3000),chime:()=>{tone(660,.3,'sine',.08);tone(990,.4,'sine',.07,.1)}};
addEventListener('pointerdown',A,{passive:true});

/* state */
let st,termT,indT;const inv=[null,null,null,null];
function freshState(){return{term:'prompt',taken:false,sel:-1,presses:0,open:false,done:false,t0:Date.now()};}
st=freshState();

/* keypad hotspots over the painted buttons */
const pad=$('#pad');
['1','2','3','4','5','6','7','8','9','*','0','-'].forEach((c,i)=>{const [cx,cy]=T.keys[i],r=T.keyR;const b=document.createElement('button');b.className='kbtn abs';placeT(b,[cx-r,cy-r,cx+r,cy+r]);b.setAttribute('aria-label','Key '+(c==='-'?'minus':c));
  b.addEventListener('pointerdown',()=>{b.classList.add('press');setTimeout(()=>b.classList.remove('press'),150);keyPress();});pad.appendChild(b);});

function idle(){return st.taken?'taken':'prompt';}
const AUTO={key:[6000,()=>idle()],denied:[2400,()=>'key'],alt:[2600,()=>idle()]};
function setTerm(s,altText){clearTimeout(termT);st.term=s;hdr.className='abs s-'+s+(st.taken?' taken':'');if(altText)$('#msgAlt').innerHTML=altText;if(s!=='key')st.presses=0;
  if(AUTO[s])termT=setTimeout(()=>{if(st.term===s)setTerm(AUTO[s][1]());},AUTO[s][0]);}
function deny(){setTerm('denied');sfx.deny();const k=st.taken?$('#gkey'):$('#skey');k.classList.remove('wiggle');void k.offsetWidth;k.classList.add('wiggle');}
function keyPress(){if(st.term==='granted')return;sfx.beep();
  if(st.term==='key'){st.presses++;if(st.presses>=2)setTimeout(deny,250);else setTerm('key');return;}
  setTerm('key');st.presses=1;}
setInterval(()=>{if(!st.taken&&st.term==='key'){const k=$('#skey');k.classList.remove('nudge');void k.offsetWidth;k.classList.add('nudge');}},3800);

function srect(el){const b=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:(b.left-s.left)/S,y:(b.top-s.top)/S,w:b.width/S,h:b.height/S};}
function over(el,ev){const b=el.getBoundingClientRect();return ev.clientX>=b.left&&ev.clientX<=b.right&&ev.clientY>=b.top&&ev.clientY<=b.bottom;}
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1500);}

function renderInv(popI){[...slotsEl.children].forEach((d,i)=>{d.innerHTML=inv[i]==='key'?'<img alt="" src="'+KEY+'">':'';d.classList.toggle('sel',st.sel===i&&!!inv[i]);d.classList.toggle('pop',i===popI);d.setAttribute('aria-label',inv[i]?'Key':'Empty slot');});}
renderInv();

/* drag */
const rg=$('#readerGlow');
function startDrag(e,src,kind,idx){
  if(e.button>0)return;e.preventDefault();
  const sx=e.clientX,sy=e.clientY,r=srect(kind==='inv'?src.querySelector('img'):src);let g=null;
  const mv=ev=>{const dx=(ev.clientX-sx)/S,dy=(ev.clientY-sy)/S;
    if(!g&&Math.hypot(dx,dy)>6){g=document.createElement('div');g.className='ghost';g.innerHTML='<img alt="" src="'+KEY+'">';Object.assign(g.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});fx.appendChild(g);src.classList.add('lifted');if(kind==='screen'){sfx.clink();if(st.term==='denied')setTerm('key');}}
    if(g){const sc=kind==='inv'?Math.min(2.2,1+Math.hypot(dx,dy)/110):1.08;g.style.transform='translate('+dx+'px,'+dy+'px) rotate('+(dx*.06)+'deg) scale('+sc+')';rg.classList.toggle('over',zoom.classList.contains('on')&&over($('#reader'),ev));}};
  const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);rg.classList.remove('over');
    if(!g){src.classList.remove('lifted');tap(kind,idx);return;}
    const zoomed=zoom.classList.contains('on'),onReader=zoomed&&over($('#reader'),ev);
    if(kind==='screen'){
      if(onReader){g.remove();takeKey(null);grant();return;}
      if(!over(hdr,ev)){takeKey(g);return;}
      snapBack(g,()=>src.classList.remove('lifted'));
    }else{
      if(onReader){g.remove();src.classList.remove('lifted');grant();return;}
      if(!zoomed&&over($('#mini'),ev)){snapBack(g,()=>src.classList.remove('lifted'));openZoom();return;}
      if(!zoomed&&over($('#plantHot'),ev))toast('The plant isn’t interested.');
      else if(!zoomed&&over($('#opening'),ev))toast('No keyhole on the doors.');
      snapBack(g,()=>src.classList.remove('lifted'));
    }};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
function snapBack(g,done){g.style.transition='transform .25s ease-out';g.style.transform='none';setTimeout(()=>{g.remove();done&&done();},260);}
function tap(kind,idx){if(kind==='screen'){deny();return;}st.sel=st.sel===idx?-1:idx;renderInv();sfx.beep();}
$('#skey').addEventListener('pointerdown',e=>{if(!st.taken&&(st.term==='key'||st.term==='denied'))startDrag(e,$('#skey'),'screen');});

function takeKey(g){
  st.taken=true;const i=inv.indexOf(null);inv[i]='key';hdr.classList.add('taken');$('#skey').classList.remove('lifted');sfx.pick();
  if(g){const t=srect(slotsEl.children[i]);g.style.transition='left .45s cubic-bezier(.3,.7,.3,1),top .45s cubic-bezier(.3,.7,.3,1),transform .45s,width .45s,height .45s';g.style.transform='none';Object.assign(g.style,{left:(t.x+t.w/2-22)+'px',top:(t.y+t.h/2-9.5)+'px',width:'44px',height:'19px'});setTimeout(()=>{g.remove();renderInv(i);},460);}
  else renderInv(i);
  setTerm('alt','?!');setTimeout(()=>{if(st.term==='alt')setTerm(idle());},1400);
}

/* terminal widgets */
$('#reader').addEventListener('click',()=>{if(st.term==='granted')return;if(st.sel>-1&&inv[st.sel]==='key'){grant();return;}
  rg.classList.remove('pulse');void rg.offsetWidth;rg.classList.add('pulse');sfx.beep();setTerm('key');st.presses=1;});
$('#access').addEventListener('click',()=>{if(st.term==='granted')return;const b=$('#barGlow');b.classList.add('on');setTimeout(()=>b.classList.remove('on'),2600);sfx.chime();setTerm('alt','Accessible service on.<br>Please present a card.');});
$('#help').addEventListener('click',()=>{if(st.term==='granted')return;sfx.beep();setTerm('alt','For help, contact<br>building management.');});
$('#lock').addEventListener('click',()=>{if(st.term==='granted')return;sfx.deny();setTerm('alt','System locked.');});

function grant(){
  const i=inv.indexOf('key');if(i>-1)inv[i]=null;st.sel=-1;renderInv();
  clearTimeout(termT);st.term='granted';hdr.className='abs s-granted taken';zoom.classList.add('granted');
  rg.classList.add('green');sfx.ok();
  setTimeout(()=>{closeZoom();$('#miniCheck').classList.add('on');setTimeout(callCar,500);},1900);
}

/* zoom */
function openZoom(){if(st.open||st.done)return;zoom.classList.add('on');zoom.setAttribute('aria-hidden','false');sfx.beep();}
function closeZoom(){zoom.classList.remove('on');zoom.setAttribute('aria-hidden','true');}
$('#mini').addEventListener('click',openZoom);
$('#mini').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openZoom();}});
$('#back').addEventListener('click',closeZoom);

/* lobby */
function rattle(){if(st.open)return;const f=$('#opening');f.classList.remove('rattle');void f.offsetWidth;f.classList.add('rattle');sfx.thud();if(st.sel>-1)toast('No keyhole on the doors.');}
$('#dL').addEventListener('click',rattle);$('#dR').addEventListener('click',rattle);
$('#plantHot').addEventListener('click',()=>{sfx.rustle();toast(st.sel>-1?'The plant isn’t interested.':'Just a plant.');});
function callCar(){let n=31;setInd(n,'down');clearInterval(indT);
  indT=setInterval(()=>{n--;setInd(n,'down');if(n<=27){clearInterval(indT);setInd(27,null);sfx.ding();setTimeout(()=>{$('#opening').classList.add('open');sfx.door();setTimeout(()=>{st.open=true;$('#arrow').classList.add('on');},1600);},600);}},420);}
$('#arrow').addEventListener('click',()=>{
  if(st.done)return;st.done=true;$('#arrow').classList.remove('on');$('#opening').classList.remove('open');sfx.door();
  setTimeout(()=>{setInd(28,'up');$('#black').classList.add('on');},1400);
  setTimeout(()=>{const s=Math.round((Date.now()-st.t0)/1000);$('#endT').textContent='Out of the lobby in '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'.';$('#end').classList.add('on');$('#black').classList.remove('on');sfx.chime();},2400);
});

/* menu / restart / sound */
function reset(){clearTimeout(termT);clearInterval(indT);st=freshState();inv.fill(null);renderInv();
  rg.classList.remove('green');zoom.classList.remove('granted');$('#miniCheck').classList.remove('on');$('#opening').classList.remove('open');$('#arrow').classList.remove('on');
  setInd(31,null);setTerm('prompt');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));$('#black').classList.remove('on');closeZoom();fx.innerHTML='';}
$('#restart').addEventListener('click',()=>{sfx.beep();reset();});
$('#again').addEventListener('click',reset);$('#restart2').addEventListener('click',reset);
$('#menu').addEventListener('click',()=>{sfx.beep();$('#menuP').classList.add('on');});
$('#resume').addEventListener('click',()=>$('#menuP').classList.remove('on'));
$('#soundB').addEventListener('click',()=>{muted=!muted;$('#soundB').textContent='SOUND: '+(muted?'OFF':'ON');});
})();
</script>

</html>
